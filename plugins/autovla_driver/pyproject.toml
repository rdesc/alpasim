[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpasim_autovla"
version = "0.1.0"
description = "AutoVLA trajectory prediction model plugin for Alpasim"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alpasim_plugins",
    "alpasim_driver",
    "numpy",
    "torch",
    "transformers>=4.49",
    "qwen-vl-utils==0.0.10",
    "pillow",
    "omegaconf",
]

# This is how we register the autovla model with the plugin system.
[project.entry-points."alpasim.models"]
autovla = "alpasim_autovla.autovla_model:AutoVLAModel"

[project.entry-points."alpasim.configs"]
autovla = "alpasim_autovla.configs"

[tool.setuptools.packages.find]
include = ["alpasim_autovla*"]

[tool.setuptools.package-data]
alpasim_autovla = ["data/*.pkl", "configs/**/*.yaml"]

[tool.uv.sources]
alpasim_plugins = { workspace = true }
alpasim_driver = { workspace = true }
