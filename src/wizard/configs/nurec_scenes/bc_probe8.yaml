# @package _global_
# 8-scene throughput probe for BC data collection: the first 8 already-cached
# nurec_curated_train scenes. Run exactly as the full sweep would be, to measure
# scenes/hour before committing to all 1761.
scenes:
  test_suite_id: nurec_bc_probe8
  scene_ids: null
  scenes_csv:
    - "${repo-relative:'data/scenes/sim_scenes.csv'}"
    - "${repo-relative:'data/scenes/sim_scenes_2604.csv'}"
  suites_csv:
    - "${repo-relative:'data/scenes/sim_suites.csv'}"
    - "${repo-relative:'data/scenes/sim_suites_curated.csv'}"
    - "${repo-relative:'data/scenes/sim_suites_bc_probe8.csv'}"
