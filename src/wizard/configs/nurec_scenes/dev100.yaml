# @package _global_
# AgenticDriver's Alpasim dev split (alpasim-curated-dev100, research/splits/ in AgenticDriver): 100
# nurec_curated_train scenes drawn at random with seed 0. Added 2026-11-06 to run Alpamayo 1.5 on the same
# scenes as the Claude teacher and AutoVLA, with the settings of the 2026-10-20 curated_val run.

scenes:
  test_suite_id: nurec_dev100
  scene_ids: null
  scenes_csv:
    - "${repo-relative:'data/scenes/sim_scenes.csv'}"
    - "${repo-relative:'data/scenes/sim_scenes_2604.csv'}"
  suites_csv:
    - "${repo-relative:'data/scenes/sim_suites.csv'}"
    - "${repo-relative:'data/scenes/sim_suites_curated.csv'}"
    - "${repo-relative:'data/scenes/sim_suites_dev100.csv'}"
