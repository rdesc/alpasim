# @package _global_
# 200-scene train subset: 100 known-hard + 100 random controls.
#
# The hard half is the 100 worst scenes (by progress) from the July Alpamayo 1.5
# public_2601 run, intersected with nurec_curated_train. Those are a prior from
# a different config, not a current measurement, and selecting on past failure
# is biased by construction -- hence the 100 random controls drawn from the same
# split, which give an unbiased reference to read the hard half against.
#
# Per-scene provenance is in train_mix200_manifest.csv at the repo root.

scenes:
  test_suite_id: nurec_train_mix200

  scene_ids: null

  scenes_csv:
    - "${repo-relative:'data/scenes/sim_scenes.csv'}"
    - "${repo-relative:'data/scenes/sim_scenes_2604.csv'}"
  suites_csv:
    - "${repo-relative:'data/scenes/sim_suites.csv'}"
    - "${repo-relative:'data/scenes/sim_suites_curated.csv'}"
    - "${repo-relative:'data/scenes/sim_suites_train_mix200.csv'}"
