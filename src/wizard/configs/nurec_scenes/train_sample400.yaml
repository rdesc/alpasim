# @package _global_
# Random stratified sample of the curated NuRec training split: 400 scenes.
#
# Stratified by HF release to match the parent split's mix (159 from 26.01,
# 241 from 26.04, against 702/1059 in nurec_curated_train) and drawn with a
# fixed seed, so it is an unbiased estimate of train-split performance rather
# than a hard-case selection.

scenes:
  test_suite_id: nurec_train_sample400

  scene_ids: null

  scenes_csv:
    - "${repo-relative:'data/scenes/sim_scenes.csv'}"
    - "${repo-relative:'data/scenes/sim_scenes_2604.csv'}"
  suites_csv:
    - "${repo-relative:'data/scenes/sim_suites.csv'}"
    - "${repo-relative:'data/scenes/sim_suites_curated.csv'}"
    - "${repo-relative:'data/scenes/sim_suites_train_sample400.csv'}"
