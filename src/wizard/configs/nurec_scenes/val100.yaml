# @package _global_
# 100 of the 441 nurec_curated_val scenes (AgenticDriver scene_sets/val100.txt, seed 0), the held-out set
# AgenticDriver evaluated the Claude teacher on (2026-11-12). Added to run Alpamayo 2 Super on the same scenes.

scenes:
  test_suite_id: nurec_val100
  scene_ids: null
  scenes_csv:
    - "${repo-relative:'data/scenes/sim_scenes.csv'}"
    - "${repo-relative:'data/scenes/sim_scenes_2604.csv'}"
  suites_csv:
    - "${repo-relative:'data/scenes/sim_suites.csv'}"
    - "${repo-relative:'data/scenes/sim_suites_curated.csv'}"
    - "${repo-relative:'data/scenes/sim_suites_val100.csv'}"
