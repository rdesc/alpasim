# @package _global_
# 4-GPU topology for BC data collection: 20 concurrent rollouts on GPUs 0-3,
# leaving GPUs 4-7 free for other work.
#
# As in 8gpu_bc_collect, the renderer takes every GPU this topology owns and
# the driver (driver=static) runs on CPU. The difference is the per-GPU load:
# 5 concurrent rollouts instead of 3, because a GPU that renders 3 scenes at
# ~96% utilisation has no spare compute. The extra concurrency buys only the
# idle gaps while a scene's artifacts load, not a higher render rate.
#
# Total capacity per service:
# - REND: 4 GPUs x 1 replica   x 5 rollouts = 20
# - DRIV: 1 CPU service x 4 replicas x 5 rollouts = 20
# - PHYS: 4 GPUs x 1 replica   x 5 rollouts = 20
# - CONT: 1 CPU service x 4 replicas x 5 rollouts = 20

defines:
  # The renderer holds ~2.5 GB per cached scene-camera, measured on the
  # 8gpu_bc_collect run: 40 GB resident at cache 16. Cache 24 is ~60 GB, and
  # with the physics service's ~4 GB that leaves ~16 GB of headroom on an 80 GB
  # A100. 8gpu_24rollouts runs cache 32, but there the physics service skips
  # two of the renderer's GPUs; here both share all four, so the cache stays
  # one step smaller rather than risk an OOM 12 hours into a sweep.
  nre_cache_size: 24  # (renderer.n_concurrent_rollouts(=5) + buffer(=1)) x 4 cameras
  physics_cache_size: 24  # >= the 20 concurrent scenes below

eval:
  num_processes: 16

services:
  renderer:
    replicas_per_container: 1
    gpus: [0, 1, 2, 3]

  # driver=static is CPU-only (model.device: cpu); it returns a constant
  # trajectory that force-GT discards, so it needs no GPU.
  driver:
    replicas_per_container: 4
    gpus: null

  physics:
    replicas_per_container: 1
    gpus: [0, 1, 2, 3]

  controller:
    replicas_per_container: 4
    gpus: null

  trafficsim:
    replicas_per_container: 1
    gpus: [0, 1]

runtime:
  nr_workers: 2
  endpoints:
    renderer:
      n_concurrent_rollouts: 5
    driver:
      n_concurrent_rollouts: 5
      skip: false
    physics:
      n_concurrent_rollouts: 5
      skip: false
    controller:
      n_concurrent_rollouts: 5
    trafficsim:
      skip: true
