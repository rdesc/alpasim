# @package _global_
# 8-GPU topology for Alpamayo 2 Super (34B, ~70 GiB per driver instance): one driver per GPU on 4-7,
# renderer on 0-3, physics kept off the driver GPUs so it does not compete with the model for memory.
# Otherwise as 8gpu_12rollouts (12 concurrent rollouts).

defines:
  nre_cache_size: 16  # (renderer.n_concurrent_rollouts(=3) + buffer(=1)) x expected_camera_count (=4)
  physics_cache_size: 16

services:
  renderer:
    replicas_per_container: 1
    gpus: [0, 1, 2, 3]

  driver:
    gpus: [4, 5, 6, 7]
    replicas_per_container: 1

  physics:
    replicas_per_container: 1
    gpus: [0, 1, 2, 3]

  controller:
    replicas_per_container: 2
    gpus: null

  trafficsim:
    replicas_per_container: 1
    gpus: [0, 1]

runtime:
  nr_workers: 1
  endpoints:
    # REND: 4 x 1 x 3 = 12
    # DRIV: 4 x 1 x 3 = 12 (max_batch_size 1: the three rollouts per driver take turns)
    # PHYS: 4 x 1 x 3 = 12
    # CONT: 1 (CPU) x 2 x 6 = 12
    renderer:
      n_concurrent_rollouts: 3
    driver:
      n_concurrent_rollouts: 3
    physics:
      n_concurrent_rollouts: 3
      skip: false
    controller:
      n_concurrent_rollouts: 6
    trafficsim:
      skip: true
